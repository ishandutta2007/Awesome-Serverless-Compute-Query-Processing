<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;overflow:hidden;">
  <defs>
    <!-- Background Linear & Radial Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="neonGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.35; }
        50% { transform: translateY(-14px) scale(1.05); opacity: 0.65; }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(16px) scale(0.95); opacity: 0.6; }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 4px; opacity: 0.6; }
        50% { r: 6.5px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      .particle1 { animation: floatSlow1 7s ease-in-out infinite; }
      .particle2 { animation: floatSlow2 8.5s ease-in-out infinite; }
      .beam-line { stroke-dasharray: 20 80; animation: pulseBeam 5s linear infinite; }
      .pulsing-node { animation: nodePulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Dynamic Ambient Glow Blobs in Background (Safe Z-index behind text) -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#softGlow)" class="particle1" />
  <circle cx="1020" cy="270" r="160" fill="#8b5cf6" filter="url(#softGlow)" class="particle2" />
  <circle cx="950" cy="70" r="110" fill="#ec4899" filter="url(#softGlow)" class="particle1" />

  <!-- Dynamic Animated Architecture Flow Lines (Behind text) -->
  <g opacity="0.45">
    <path d="M 50,300 C 300,320 400,240 600,280 S 900,340 1150,290" fill="none" stroke="#0284c7" stroke-width="2" class="beam-line" />
    <path d="M 50,60 C 250,30 450,110 700,70 S 1000,20 1150,80" fill="none" stroke="#a855f7" stroke-width="2" class="beam-line" style="animation-duration: 6s;" />
    <path d="M 100,180 C 350,140 500,220 800,160 S 1050,210 1150,170" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3" />
  </g>

  <!-- Architectural Constellation Nodes -->
  <g fill="#38bdf8">
    <circle cx="140" cy="70" r="5" class="pulsing-node" />
    <circle cx="280" cy="40" r="4" opacity="0.7" />
    <circle cx="1050" cy="80" r="5" class="pulsing-node" style="animation-delay: 1s;" />
    <circle cx="1120" cy="190" r="4" opacity="0.6" />
    <circle cx="980" cy="310" r="6" class="pulsing-node" style="animation-delay: 1.8s;" />
    <circle cx="120" cy="290" r="5" class="pulsing-node" style="animation-delay: 0.6s;" />
  </g>

  <!-- High-Tech Floating Decorative Background Cards (Flanking Sides, Clear of Center Title) -->
  <!-- Left Side Badges -->
  <g transform="translate(60, 105)">
    <rect width="180" height="42" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="7" fill="#38bdf8" opacity="0.9"/>
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">⚡ Scale-To-Zero</text>
  </g>
  <g transform="translate(40, 165)">
    <rect width="210" height="42" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="7" fill="#818cf8" opacity="0.9"/>
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🚀 Sub-ms Cold Starts</text>
  </g>
  <g transform="translate(60, 225)">
    <rect width="180" height="42" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="7" fill="#34d399" opacity="0.9"/>
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">📊 Elastic SQL &amp; OLAP</text>
  </g>

  <!-- Right Side Badges -->
  <g transform="translate(950, 105)">
    <rect width="190" height="42" rx="8" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="7" fill="#ec4899" opacity="0.9"/>
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🤖 Serverless GPU AI</text>
  </g>
  <g transform="translate(930, 165)">
    <rect width="220" height="42" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="7" fill="#a855f7" opacity="0.9"/>
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🌐 Edge Isolates (V8/WASM)</text>
  </g>
  <g transform="translate(950, 225)">
    <rect width="190" height="42" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="7" fill="#38bdf8" opacity="0.9"/>
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">📦 Micro-VM &amp; K8s FaaS</text>
  </g>

  <!-- Main Center Header Content (Guaranteed Foreground & Clear Readability) -->
  <g text-anchor="middle">
    <!-- Category Mini-Tag -->
    <rect x="420" y="44" width="360" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="600" y="63" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">⚡ CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title with Gradient Fill and Backdrop -->
    <text x="600" y="138" fill="url(#neonGlow1)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="39" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Serverless Compute</text>
    <text x="600" y="185" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">&amp; Query Processing</text>

    <!-- Subtitle Line -->
    <text x="600" y="234" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400">
      Production-Ready SaaS Platforms, Edge Runtimes &amp; Open-Source Distributed Query Engines
    </text>

    <!-- Spec Badges Row -->
    <g transform="translate(600, 276)">
      <rect x="-240" y="0" width="140" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="-170" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ FaaS &amp; Containers</text>

      <rect x="-85" y="0" width="170" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="0" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔍 Vectorized SQL &amp; OLAP</text>

      <rect x="100" y="0" width="140" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="170" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🤖 Serverless GPUs</text>
    </g>
  </g>

  <!-- Border Accent Line at Bottom -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#neonGlow1)"/>
</svg>
